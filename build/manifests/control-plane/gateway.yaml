# The HTTP gateway for the cluster's Service, a static Pod on the
# control-plane node: hostNetwork on port 8081, published on 127.0.0.1:18080.
# The node's kubelet keeps the routes to every node's Pod subnet. Replaced by
# kube-proxy and an Ingress controller in M6.
apiVersion: v1
kind: Pod
metadata:
  name: gateway
  namespace: kube-system
  labels:
    component: gateway
spec:
  hostNetwork: true
  containers:
  - name: gateway
    image: mini-k8s:local
    imagePullPolicy: Never
    command: ["/mini", "gateway"]
    env:
    - name: MINI_TOKEN_FILE
      value: /etc/mini-k8s/token
    - name: MINI_API
      value: http://127.0.0.1:8080
    - name: MINI_GATEWAY_ADDR
      value: ":8081"
    volumeMounts:
    - name: credentials
      mountPath: /etc/mini-k8s
      readOnly: true
  volumes:
  - name: credentials
    hostPath:
      path: /etc/mini-k8s
      type: Directory
