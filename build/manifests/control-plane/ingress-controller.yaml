# The Ingress controller, a static Pod on the control-plane node: hostNetwork
# on port 8081, published on 127.0.0.1:18080. It proxies to the endpoints
# of the Services the Ingresses name, through the node's routes to every
# node's Pod subnet.
apiVersion: v1
kind: Pod
metadata:
  name: ingress-controller
  namespace: kube-system
  labels:
    component: ingress-controller
spec:
  hostNetwork: true
  containers:
  - name: ingress-controller
    image: mini-k8s:local
    imagePullPolicy: Never
    command: ["/mini", "ingress-controller"]
    env:
    - name: MINI_TOKEN_FILE
      value: /etc/mini-k8s/token
    - name: MINI_API
      value: http://127.0.0.1:8080
    - name: MINI_INGRESS_ADDR
      value: ":8081"
    volumeMounts:
    - name: credentials
      mountPath: /etc/mini-k8s
      readOnly: true
  volumes:
  - name: credentials
    hostPath:
      path: /etc/mini-k8s
      type: Directory
