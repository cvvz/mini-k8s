# Static Pod run by the control-plane node's kubelet.
apiVersion: v1
kind: Pod
metadata:
  name: kube-controller-manager
  namespace: kube-system
  labels:
    component: kube-controller-manager
    tier: control-plane
spec:
  hostNetwork: true
  containers:
  - name: kube-controller-manager
    image: mini-k8s:local
    imagePullPolicy: Never
    command: ["/mini", "kube-controller-manager"]
    env:
    - name: MINI_TOKEN_FILE
      value: /etc/mini-k8s/token
    - name: MINI_API
      value: http://127.0.0.1:8080
    volumeMounts:
    - name: credentials
      mountPath: /etc/mini-k8s
      readOnly: true
  volumes:
  - name: credentials
    hostPath:
      path: /etc/mini-k8s
      type: Directory
