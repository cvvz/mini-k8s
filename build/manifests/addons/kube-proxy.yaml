# kube-proxy, a DaemonSet in kube-system as kubeadm installs it: one Pod on
# every node (it tolerates every taint, so the control-plane node too),
# privileged and on the host network, programming the node's iptables for
# Services. mini has no ServiceAccounts, so it reads the API token from its
# node and talks to the API server by the control-plane node's name.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-proxy
  namespace: kube-system
  labels:
    k8s-app: kube-proxy
spec:
  selector:
    matchLabels:
      k8s-app: kube-proxy
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        k8s-app: kube-proxy
    spec:
      hostNetwork: true
      tolerations:
      - operator: Exists
      containers:
      - name: kube-proxy
        image: mini-k8s-kube-proxy:local
        imagePullPolicy: Never
        command: ["/usr/local/bin/mini", "kube-proxy"]
        env:
        - name: MINI_TOKEN_FILE
          value: /etc/mini-k8s/token
        - name: MINI_API
          value: http://control-plane:8080
        securityContext:
          privileged: true
        volumeMounts:
        - name: credentials
          mountPath: /etc/mini-k8s
          readOnly: true
        - name: xtables-lock
          mountPath: /run/xtables.lock
      volumes:
      - name: credentials
        hostPath:
          path: /etc/mini-k8s
          type: Directory
      - name: xtables-lock
        hostPath:
          path: /run/xtables.lock
          type: FileOrCreate
