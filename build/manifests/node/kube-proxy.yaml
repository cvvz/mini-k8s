# kube-proxy, a static Pod on every node (a DaemonSet once mini has them):
# privileged and hostNetwork, it programs the node's iptables for Services.
# The same manifest is in build/manifests/control-plane.
apiVersion: v1
kind: Pod
metadata:
  name: kube-proxy
  namespace: kube-system
  labels:
    k8s-app: kube-proxy
spec:
  hostNetwork: true
  tolerations:
  - operator: Exists
  containers:
  - name: kube-proxy
    image: mini-k8s-kube-proxy:local
    imagePullPolicy: Never
    command: ["/usr/local/bin/mini", "kube-proxy"]
    env:
    - name: MINI_TOKEN_FILE
      value: /etc/mini-k8s/token
    - name: MINI_API
      value: http://control-plane:8080
    securityContext:
      privileged: true
    volumeMounts:
    - name: credentials
      mountPath: /etc/mini-k8s
      readOnly: true
    - name: xtables-lock
      mountPath: /run/xtables.lock
  volumes:
  - name: credentials
    hostPath:
      path: /etc/mini-k8s
      type: Directory
  - name: xtables-lock
    hostPath:
      path: /run/xtables.lock
      type: FileOrCreate
