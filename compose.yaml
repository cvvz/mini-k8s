name: mini-k8s
# Compose only starts the "machines". Each node is a privileged container,
# like a kind node: it runs its own containerd (Pods are containers inside it)
# and the kubelet. The control plane (etcd, kube-apiserver,
# kube-controller-manager, kube-scheduler) and the Ingress controller are
# static Pods the control-plane node's kubelet runs from
# build/manifests/control-plane; kube-proxy and the other add-ons are
# applied by `kk cluster up` from build/manifests/addons.
#
# /var is a volume because containerd's overlay snapshots cannot live on the
# container's own overlay filesystem, and it keeps etcd data and emptyDir
# volumes across restarts; /run and /tmp start empty on every boot. containerd
# shims daemonize and are re-parented to PID 1 when they exit, so an init
# process (Docker's tini) reaps them.
x-node: &node
  image: mini-k8s-node:local
  restart: unless-stopped
  init: true
  privileged: true
  cgroup: private
  security_opt: [seccomp=unconfined, apparmor=unconfined]
  tmpfs: [/run, /tmp]
  networks: [cluster]
  environment: &env
    MINI_API: http://control-plane:8080
    MINI_TOKEN: ${MINI_TOKEN:?run kk cluster up}
services:
  control-plane:
    <<: *node
    hostname: control-plane
    environment:
      <<: *env
      MINI_API: http://127.0.0.1:8080
      MINI_NODE: control-plane
      MINI_NODE_ROLE: control-plane
    ports:
      - "127.0.0.1:18000:8080" # kube-apiserver
      - "127.0.0.1:18080:8081" # Ingress controller
    volumes:
      - control-plane-var:/var
      - ./build/manifests/control-plane:/etc/kubernetes/manifests:ro
      - ./.mini-k8s/token:/etc/mini-k8s/token:ro
  worker-1:
    <<: *node
    hostname: worker-1
    environment:
      <<: *env
      MINI_NODE: worker-1
      MINI_NODE_ROLE: worker
    volumes:
      - worker-1-var:/var
      - ./.mini-k8s/token:/etc/mini-k8s/token:ro
    depends_on: [control-plane]
  worker-2:
    <<: *node
    hostname: worker-2
    environment:
      <<: *env
      MINI_NODE: worker-2
      MINI_NODE_ROLE: worker
    volumes:
      - worker-2-var:/var
      - ./.mini-k8s/token:/etc/mini-k8s/token:ro
    depends_on: [control-plane]
networks:
  cluster:
    name: mini-k8s
volumes:
  control-plane-var:
  worker-1-var:
  worker-2-var:
