apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: mini-k8s:local
          command: ["/mini"]
          args: ["demo"]
          ports:
            - name: http
              containerPort: 8080
          resources:            # becomes the container's cgroup limits
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          readinessProbe:       # only ready Pods receive Service traffic
            httpGet:
              path: /ready
              port: http
            periodSeconds: 1
            failureThreshold: 2
          livenessProbe:        # a failing container is restarted
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
---
apiVersion: v1
kind: Service              # a cluster IP that kube-proxy balances over the ready Pods
metadata:
  name: web
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress              # published by the Ingress controller on 127.0.0.1:18080
metadata:
  name: web
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
