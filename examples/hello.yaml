# A Deployment exposed on every node through a NodePort Service: reach it
# from the host at http://<node INTERNAL-IP>:<node port> (kk get nodes -o wide,
# kk get svc hello).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello
  template:
    metadata:
      labels:
        app: hello
    spec:
      containers:
        - name: hello
          image: mini-k8s:local
          command: ["/mini"]
          args: ["demo"]
---
apiVersion: v1
kind: Service
metadata:
  name: hello
spec:
  type: NodePort
  selector:
    app: hello
  ports:
    - port: 80
      targetPort: 8080
